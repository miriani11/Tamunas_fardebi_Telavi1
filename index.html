    <!-- JavaScript for Calculator -->
    <script>
        function calculatePrice() {
            let width = parseFloat(document.getElementById('width').value) || 0;
            let height = parseFloat(document.getElementById('height').value) || 0;
            let fabricPricePerSqm = parseFloat(document.getElementById('fabricType').value) || 0;
            let includeRod = document.getElementById('includeRod').checked;

            let area = width * height * 1.5;
            let fabricTotal = area * fabricPricePerSqm;
            let rodTotal = includeRod ? (width * 40) : 0;
            let total = Math.round(fabricTotal + rodTotal);

            document.getElementById('totalPrice').innerText = total + " ₾";
            document.getElementById('resultBox').classList.remove('hidden');
        }
    </script>
